<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form Registrasi</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            font-size: 13px;
        }
        h2 {
            margin-bottom: 5px;
        }
        fieldset {
            margin-bottom: 15px;
            border: 1px solid #777;
            padding: 10px 15px;
        }
        legend {
            font-weight: bold;
        }
        table {
            width: 100%;
        }
        td {
            padding: 4px 2px;
            vertical-align: top;
        }
        .label-col {
            width: 180px;
        }
        .separator {
            width: 10px;
            text-align: center;
        }
    </style>
</head>
<body>

    <h2>Form Registrasi</h2>
    <hr style="border: 0; border-top: 1px solid #000; margin-bottom: 15px;">

    <form action="" method="get">
        
        <!-- BIODATA -->
        <fieldset>
            <legend>Biodata</legend>
            <table>
                <tr>
                    <td class="label-col">Nama Mahasiswa</td>
                    <td class="separator">:</td>
                    <td><input type="text" name="nama" size="25" placeholder="Nama Anda"></td>
                </tr>
                <tr>
                    <td>No Induk Mahasiswa (NIM)</td>
                    <td>:</td>
                    <td><input type="text" name="nim" size="15" placeholder="123456789"></td>
                </tr>
                <tr>
                    <td>Alamat Mahasiswa</td>
                    <td>:</td>
                    <td><textarea name="alamat" cols="30" rows="4" placeholder="Alamat Anda"></textarea></td>
                </tr>
                <tr>
                    <td>Tanggal Lahir</td>
                    <td>:</td>
                    <td>
                        <select name="tanggal">
                            <option value="1" selected>01</option>
                            <option value="2">02</option>
                            <option value="3">03</option>
                            <option value="4">04</option>
                            <option value="5">05</option>
                            <option value="6">06</option>
                            <option value="7">07</option>
                            <option value="8">08</option>
                            <option value="9">09</option>
                            <option value="10">10</option>
                            <option value="11">11</option>
                            <option value="12">12</option>
                            <option value="13">13</option>
                            <option value="14">14</option>
                            <option value="15">15</option>
                            <option value="16">16</option>
                            <option value="17">17</option>
                            <option value="18">18</option>
                            <option value="19">19</option>
                            <option value="20">20</option>
                            <option value="21">21</option>
                            <option value="22">22</option>
                            <option value="23">23</option>
                            <option value="24">24</option>
                            <option value="25">25</option>
                            <option value="26">26</option>
                            <option value="27">27</option>
                            <option value="28">28</option>
                            <option value="29">29</option>
                            <option value="30">30</option>
                            <option value="31">31</option>
                        </select>
                            <!-- Tambahan opsi hari lainnya -->
                        </select>
                        <select name="bulan">
                            <option value="januari" selected>Januari</option>
                            <option value="februari">Februari</option>
                            <option value="maret">Maret</option>
                            <option value="april">April</option>
                            <option value="mei">Mei</option>
                            <option value="juni">Juni</option>
                            <option value="juli">Juli</option>
                            <option value="agustus">Agustus</option>
                            <option value="september">September</option>
                            <option value="oktober">Oktober</option>
                            <option value="november">November</option>
                            <option value="desember">Desember</option>
                            <!-- Tambahan opsi bulan lainnya -->
                        </select>
                        <select name="tahun">
                                <option value="1990" selected>1990</option>
                                <option value="1991">1991</option>
                                <option value="1992">1992</option>
                                <option value="1993">1993</option>
                                <option value="1994">1994</option>
                                <option value="1995">1995</option>
                                <option value="1996">1996</option>
                                <option value="1997">1997</option>
                                <option value="1998">1998</option>
                                <option value="1999">1999</option>
                                <option value="2000">2000</option>
                                <option value="2001">2001</option>
                                <option value="2002">2002</option>
                                <option value="2003">2003</option>
                                <option value="2004">2004</option>
                                <option value="2005">2005</option>
                                <option value="2006">2006</option>
                                <option value="2007">2007</option>
                                <option value="2008">2008</option>
                                <option value="2009">2009</option>
                                <option value="2010">2010</option>
</select>
                            
                        </select>
                    </td>
                </tr>
                <tr>
                    <td>Jenis Kelamin</td>
                    <td>:</td>
                    <td>
                        <input type="radio" name="gender" value="pria" id="pria" checked><label for="pria">Pria</label>
                        <input type="radio" name="gender" value="wanita" id="wanita"><label for="wanita">Wanita</label>
                    </td>
                </tr>
                <tr>
                    <td>Upload Foto</td>
                    <td>:</td>
                    <td><input type="file" name="foto"></td>
                </tr>
                <tr>
                    <td>URL Website</td>
                    <td>:</td>
                    <td><input type="text" name="url" size="30" placeholder="URL Website Anda"></td>
                </tr>
                <tr>
                    <td>Perguruan Tinggi</td>
                    <td>:</td>
                    <td><input type="text" name="pt" size="20"></td>
                </tr>
            </table>
        </fieldset>

        <!-- INFO AKUN -->
        <fieldset>
            <legend>Info Akun</legend>
            <table>
                <tr>
                    <td class="label-col">Email</td>
                    <td class="separator">:</td>
                    <td><input type="email" name="email" size="25" placeholder="Email Anda"></td>
                </tr>
                <tr>
                    <td>Username</td>
                    <td>:</td>
                    <td><input type="text" name="username" size="25" placeholder="Username Anda"></td>
                </tr>
                <tr>
                    <td>Password</td>
                    <td>:</td>
                    <td><input type="password" name="password" size="25" placeholder="Password Anda"></td>
                </tr>
                <tr>
                    <td>Ulangi Password</td>
                    <td>:</td>
                    <td><input type="password" name="re_password" size="25" placeholder="Password Anda"></td>
                </tr>
            </table>
        </fieldset>

        <!-- KEMAMPUAN DASAR -->
        <fieldset>
            <legend>Kemampuan Dasar</legend>
            <div>
                <input type="checkbox" name="skill[]" value="html" id="html"><label for="html">HTML</label>
                <input type="checkbox" name="skill[]" value="css" id="css"><label for="css">CSS</label>
                <input type="checkbox" name="skill[]" value="javascript" id="js"><label for="js">Javascript</label>
                <input type="checkbox" name="skill[]" value="php" id="php"><label for="php">PHP</label>
                <input type="checkbox" name="skill[]" value="mysql" id="mysql"><label for="mysql">MySQL</label>
                <input type="checkbox" name="skill[]" value="laravel" id="laravel"><label for="laravel">Laravel</label>
                <input type="checkbox" name="skill[]" value="react" id="react"><label for="react">React Native</label>
            </div>
        </fieldset>

        <!-- TOMBOL AKSI -->
        <div>
            <input type="reset" value="Reset">
            <input type="submit" value="Simpan">
            <input type="button" value="Button">
        </div>

    </form>

</body>
</html>
